function showHome(){activeCat=null;searchMode=false;document.getElementById("hero-section").style.display="";document.getElementById("search-inp").value="";render();}
function openCat(id){activeCat=id;activeSub=0;document.getElementById("hero-section").style.display="none";renderCat();window.scrollTo(0,0);}
function setSub(i){activeSub=i;renderCat();}
function setGender(g,btn){GENDER=g;document.querySelectorAll(".g-tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");if(activeCat)renderCat();else if(!searchMode)render();}
function toggleLang(){LANG=LANG==="es"?"en":"es";document.getElementById("lang-btn").textContent=LANG==="es"?"EN":"ES";document.querySelectorAll("[data-es]").forEach(el=>{el.textContent=LANG==="es"?el.dataset.es:el.dataset.en;});document.getElementById("search-inp").placeholder=L("Buscar productos...","Search products...");if(searchMode)renderSearch();else if(activeCat)renderCat();else render();}
function searchProducts(v){if(v.trim().length>1){searchMode=true;activeCat=null;document.getElementById("hero-section").style.display="none";renderSearch();}else if(!v.trim()){searchMode=false;showHome();}}

function render(){
  let h='<div class="section"><div class="section-title">📦 '+L("CATEGORÍAS","CATEGORIES")+'</div><div class="cat-grid">';
  CATEGORIES.forEach(cat=>{
    h+=`<a class="cat-card fade-up" onclick="openCat('${cat.id}')" href="javascript:void(0)"><span class="cat-icon">${cat.icon}</span><div class="cat-name">${L(cat.es,cat.en)}</div></a>`;
  });
  h+='</div></div>';
  h+='<div class="coach-section"><div class="coach-banner"><div class="coach-tag">⭐ '+L("RECOMENDADO POR EL COACH","RECOMMENDED BY THE COACH")+'</div><div class="coach-title">TOP 7 ESENCIALES</div>';
  COACH_RECS.forEach((r,i)=>{
    h+=`<a class="coach-prod" href="${amz(r.q)}" target="_blank"><div class="coach-prod-num">${i+1}</div><div class="coach-prod-info"><div class="coach-prod-name">${L(r.es,r.en)}</div><div class="coach-prod-why">${L(r.es_why,r.en_why)}</div></div><div style="color:var(--gold)">↗</div></a>`;
  });
  h+='</div></div>';
  document.getElementById("main-content").innerHTML=h;
}

function renderCat(){
  const cat=CATEGORIES.find(c=>c.id===activeCat);
  const data=P[activeCat];
  if(!cat||!data){showHome();return;}
  const subs=L(data.subs.es,data.subs.en);
  let items=data.items.filter(p=>GENDER==="all"||p.g==="all"||p.g===GENDER);
  if(activeSub>0&&items.length>0){const sk=subs[activeSub].toLowerCase();const filtered=items.filter(p=>(L(p.es,p.en)+L(p.es_d||"",p.en_d||"")+p.q).toLowerCase().includes(sk));if(filtered.length)items=filtered;}
  let h=`<div class="products-wrap"><div class="cat-header"><div class="cat-header-icon">${cat.icon}</div><div class="cat-header-title">${L(cat.es,cat.en).toUpperCase()}</div><button class="back-btn" onclick="showHome()">← ${L("Volver","Back")}</button></div><div class="sub-tabs">`;
  subs.forEach((s,i)=>{h+=`<button class="sub-tab${i===activeSub?' active':''}" onclick="setSub(${i})">${s}</button>`;});
  h+=`</div><div class="prod-grid">`;
  items.forEach(p=>{
    const badgeClass=p.b&&(p.b.es==="PREMIUM"||p.b.en==="PREMIUM")?"red":p.b&&(p.b.es==="OFICIAL"||p.b.en==="OFFICIAL")?"blue":"";
    h+=`<div class="prod-card fade-up">${p.b?`<div class="prod-badge ${badgeClass}">${L(p.b.es,p.b.en)}</div>`:''}<div class="prod-body"><div class="prod-name">${L(p.es,p.en)}</div><div class="prod-desc">${L(p.es_d||"",p.en_d||"")}</div><div class="prod-footer"><div class="prod-price">${p.p}</div><a class="prod-btn" href="${amz(p.q)}" target="_blank">${L("VER EN AMAZON","VIEW ON AMAZON")} ↗</a></div></div></div>`;
  });
  h+=`</div></div>`;
  document.getElementById("main-content").innerHTML=h;
}

    P[catId].items.forEach(p=>{
      if((L(p.es,p.en)+L(p.es_d||"",p.en_d||"")+p.q).toLowerCase().includes(q)&&(GENDER==="all"||p.g==="all"||p.g===GENDER)){
        results.push({...p,catIcon:cat.icon,catName:L(cat.es,cat.en)});
      }
    });
  });
  let h=`<div class="products-wrap"><div class="cat-header"><div class="cat-header-icon">🔍</div><div class="cat-header-title">${L("RESULTADOS","RESULTS")}</div><button class="back-btn" onclick="showHome()">← ${L("Volver","Back")}</button></div>`;
  if(!results.length){h+=`<div style="text-align:center;padding:40px;color:var(--muted)">${L("Sin resultados para","No results for")} "${q}"</div>`;}
  else{h+=`<div style="font-size:12px;color:var(--muted);margin-bottom:12px">${results.length} ${L("productos","products")}</div><div class="prod-grid">`;results.forEach(p=>{h+=`<div class="prod-card fade-up"><div class="prod-body"><div style="font-size:10px;color:var(--gold);margin-bottom:4px">${p.catIcon} ${p.catName}</div><div class="prod-name">${L(p.es,p.en)}</div><div class="prod-desc">${L(p.es_d||"",p.en_d||"")}</div><div class="prod-footer"><div class="prod-price">${p.p}</div><a class="prod-btn" href="${amz(p.q)}" target="_blank">${L("VER","VIEW")} ↗</a></div></div></div>`;});h+=`</div>`;}
  h+=`</div>`;
  document.getElementById("main-content").innerHTML=h;
}

render();
</script>
</body>
</html>
